        function renderTabla(equipo, color) {
            const equiposActuales = getEquiposActuales();
            const equipoData = equiposActuales[equipo];
            const puntajes = getPuntosActuales()[equipo];

            let html = `<div class="bg-slate-800 border-2 border-${color}-500 rounded-lg overflow-hidden">
                <div class="bg-gradient-to-r from-${color}-900 to-slate-900 p-2 border-b border-${color}-500">
                    <h2 class="text-lg font-bold text-${color}-400">${equipo.charAt(0).toUpperCase() + equipo.slice(1)}</h2>
                </div>`;

            // Si no hay jugadores asignados (Fecha 2 vacía)
            if (!equipoData || equipoData.length === 0) {
                html += `<div class="p-8 text-center text-slate-400">
                    <p class="text-sm">Sin jugadores asignados aún</p>
                </div>`;
            } else {
                html += `<div class="overflow-x-auto">
                    <table class="w-full text-xs">
                        <thead>
                            <tr class="bg-${color}-500/20 border-b border-${color}-500">
                                <th class="p-1 text-left text-${color}-400 font-bold text-xs w-8">Esc</th>
                                <th class="p-1 text-left text-${color}-400 font-bold text-xs">Jugador</th>
                                <th class="p-1 text-center text-${color}-400 font-bold text-xs w-12">Pts</th>
                            </tr></thead><tbody>`;

                equipoData.forEach((player, idx) => {
                const escudo = player.team ? `<img src="${getEscudoUrl(player.team)}" class="w-6 h-6 rounded" alt="escudo">` : '';
                let playerName = player.name;
                let playerClass = 'text-slate-200';

                if (player.special === 'incognito') {
                    playerClass = 'text-green-400';
                } else if (player.special === 'tapado') {
                    playerClass = 'text-red-400';
                }

                html += `<tr class="border-b border-slate-700 hover:bg-slate-700/30">
                    <td class="p-1">${escudo}</td>
                    <td class="p-1 text-xs"><span class="${playerClass}">${playerName}</span></td>
                    <td class="p-1 text-center text-${color}-400 font-bold text-xs">${puntajes[idx]}</td>
                </tr>`;
            });

            const totalPts = puntajes.reduce((a, b) => a + b, 0);
            const jugaron = puntajes.filter(p => p !== 0).length;
            const capitanIdx = equipoData.findIndex(p => p.name.includes('©'));
            const capitanJugo = capitanIdx !== -1 && puntajes[capitanIdx] !== 0 ? 1 : 0;
            const divisor = jugaron + capitanJugo;
            const promedio = divisor > 0 ? (totalPts / divisor).toFixed(2) : 0;

            html += `<tr class="border-t-2 border-${color}-500 bg-${color}-500/10">
                    <td class="p-2"></td>
                    <td class="p-2 text-${color}-400 font-bold text-sm">TOTAL</td>
                    <td class="p-2 text-center text-${color}-400 font-bold text-lg">${totalPts}</td>`;

            html += `</tr>
                <tr class="bg-${color}-500/5">
                    <td class="p-2"></td>
                    <td class="p-2 text-${color}-400 font-bold text-sm">Jugaron</td>
                    <td class="p-2 text-center text-${color}-400 font-bold text-lg">${jugaron}/11</td>
                </tr>
                <tr class="bg-${color}-500/5">
                    <td class="p-2"></td>
                    <td class="p-2 text-${color}-400 font-bold text-sm">Promedio</td>
                    <td class="p-2 text-center text-${color}-400 font-bold text-lg">${promedio}</td>
                </tr></tbody></table></div>`;
            }

            html += `</div>`;

            return html;
        }

        function updatePuntos(equipo, idx, valor) {
            const puntosActuales = getPuntosActuales();
            puntosActuales[equipo][idx] = parseInt(valor) || 0;
            document.getElementById(`${equipo}-pts-${idx}`).innerText = puntosActuales[equipo][idx];
            render();
        }

        function guardarPuntos() {
            const fecha = state.activeSubTab === 'fecha1' ? 'Fecha 1' : 'Fecha 2';
            localStorage.setItem('granDTPuntos', JSON.stringify({
                fecha1: state.puntosFecha1,
                fecha2: state.puntosFecha2
            }));
            alert(`✅ Puntajes de ${fecha} guardados exitosamente`);
        }

        function cargarPuntos() {
            const datos = localStorage.getItem('granDTPuntos');
            if (datos) {
                const parsed = JSON.parse(datos);
                // Nuevo formato con fecha1 y fecha2
                if (parsed.fecha1 && parsed.fecha2) {
                    state.puntosFecha1 = parsed.fecha1;
                    state.puntosFecha2 = parsed.fecha2;
                } else {
                    // Formato antiguo - copiar a Fecha1
                    state.puntosFecha1 = parsed;
                }
            }
        }

        function exportarDatos() {
            const datos = JSON.stringify({
                fecha1: state.puntosFecha1,
                fecha2: state.puntosFecha2
            });
            const modal = document.getElementById('datosModal');
            document.getElementById('datosText').value = datos;
            modal.style.display = 'block';
        }

        function copiarDatos() {
            const textarea = document.getElementById('datosText');
            textarea.select();
            document.execCommand('copy');
            alert('✅ Datos copiados al portapapeles');
        }

        function cerrarModal() {
            document.getElementById('datosModal').style.display = 'none';
        }

        function importarDatos() {
            const input = document.getElementById('importInput').value.trim();
            if (!input) {
                alert('Por favor pega los datos en el campo');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                if (parsed.fecha1) {
                    state.puntosFecha1 = parsed.fecha1;
                    state.puntosFecha2 = parsed.fecha2 || state.puntosFecha2;
                    localStorage.setItem('granDTPuntos', JSON.stringify(parsed));
                    document.getElementById('importInput').value = '';
                    render();
                    alert('✅ Datos restaurados exitosamente');
                } else {
                    alert('Formato incorrecto - debe contener fecha1 y fecha2');
                }
            } catch (e) {
                alert('Error al procesar los datos - verifica que sea JSON válido');
            }
        }

        function renderTablaDeposiciones() {
            const posiciones = [
                { jugador: 'Marian', puntaje: 449 },
                { jugador: 'Gaston', puntaje: 423 },
                { jugador: 'Guido', puntaje: 411 },
                { jugador: 'Nacho', puntaje: 403 }
            ];

            let html = `<div class="bg-slate-800 border-2 border-yellow-500 rounded-lg overflow-hidden max-w-md mx-auto mt-8">
                <div class="bg-gradient-to-r from-yellow-900 to-slate-900 p-4 border-b border-yellow-500">
                    <h2 class="text-2xl font-bold text-yellow-400">🏆 Tabla de Posiciones</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-yellow-500/20 border-b border-yellow-500">
                                <th class="p-3 text-left text-yellow-400 font-bold">Jugador</th>
                                <th class="p-3 text-center text-yellow-400 font-bold">Puntaje</th>
                            </tr>
                        </thead>
                        <tbody>`;

            posiciones.forEach((pos, idx) => {
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '4️⃣';
                html += `<tr class="border-b border-slate-700 hover:bg-slate-700/30">
                    <td class="p-3 text-yellow-400 font-bold">${medal} ${pos.jugador.charAt(0).toUpperCase() + pos.jugador.slice(1)}</td>
                    <td class="p-3 text-center text-yellow-400 font-bold text-lg">${pos.puntaje}</td>
                </tr>`;
            });

            html += `</tbody>
                    </table>
                </div>
            </div>`;

            return html;
        }

        function render() {
            let html = `<div class="sticky top-0 z-50 bg-gradient-to-r from-slate-900 to-slate-800 border-b border-blue-500 p-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-4xl font-black text-center flex-grow text-white">⚽ GRAN DT</h1>
                    <button onclick="exportarDatos()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold">💾 Datos</button>
                </div>
            </div>`;

            // Modal para exportar datos
            html += `<div id="datosModal" class="fixed inset-0 bg-black/50 z-40 hidden flex items-center justify-center" onclick="if(event.target === this) cerrarModal()">
                <div class="bg-slate-800 border border-slate-600 rounded-lg p-6 max-w-md w-full m-4">
                    <h3 class="text-lg font-bold text-white mb-4">📋 Copiar/Pegar Datos</h3>
                    <textarea id="datosText" class="w-full h-40 p-2 bg-slate-700 border border-slate-600 text-slate-100 text-xs rounded mb-4 font-mono" readonly></textarea>
                    <div class="flex gap-2">
                        <button onclick="copiarDatos()" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded text-sm">📋 Copiar</button>
                        <button onclick="cerrarModal()" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded text-sm">Cerrar</button>
                    </div>
                </div>
            </div>`;

            // Sub-tabs dentro de F11
            html += `<div class="px-4 py-3 flex gap-2 border-b border-slate-700 bg-slate-800/50 flex-wrap">
                <button onclick="state.activeSubTab='fecha1'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha1' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 1</button>
                <button onclick="state.activeSubTab='fecha2'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha2' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 2</button>
                <button onclick="state.activeSubTab='fecha3'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha3' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 3</button>
                <button onclick="state.activeSubTab='fecha4'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha4' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 4</button>
                <button onclick="state.activeSubTab='fecha5'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha5' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 5</button>
                <button onclick="state.activeSubTab='fecha6'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'fecha6' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">📅 Fecha 6</button>
                <button onclick="state.activeSubTab='posiciones'; render()" class="px-4 py-2 rounded ${state.activeSubTab === 'posiciones' ? 'bg-yellow-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">🏆 Tabla de Posiciones</button>
            </div>`;

            html += `<div class="p-4 max-w-full mx-auto">`;

            if (state.activeSubTab === 'posiciones') {
                html += renderTablaDeposiciones();
            } else {
                html += `<div class="grid grid-cols-4 gap-4">
                    ${renderTabla('nacho', 'green')}
                    ${renderTabla('gaston', 'blue')}
                    ${renderTabla('guido', 'purple')}
                    ${renderTabla('marian', 'pink')}
                </div>`;
            }

            html += `</div>`;

            document.getElementById('app').innerHTML = html;
        }

        cargarPuntos();
        render();
    </script>
</body>
</html>
